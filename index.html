<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page de Recherche</title>
    <link rel="icon" type="image/x-icon" href="logo/favicon_192.png">

    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <!-- Mail -->
    <div class="top">
        <div class="gauche">
            <div><a href="https://github.com/fablab-loritz/loritz-search-page/blob/main/README.md">À propos</a></div>
        </div>
        <div class="droite">
            <div><a href="https://webmail.ac-nancy-metz.fr/">Webmail</a></div>
            <div><a href="https://partage.ac-nancy-metz.fr/">Partage</a></div>
            <div><a href="https://nuage.apps.education.fr/">Nuage</a></div>
        </div>
    </div>


    <div class="v-center">
        <!-- Bannière -->
        
        <a href="https://www.loritz.fr/" class="banner-link">
            <img src="logo/logo+txt-gris-fonce.svg" alt="Lycée Henri Loritz" class="logo">
        </a>
        
        <!--
        <a href="https://jpo.loritz.fr/" class="banner-link">
            <img src="logo/portes-ouvertes-2026.png" alt="Lycée Henri Loritz - Portes Ouvertes" class="banner-jpo">
        </a>
        -->

        <!-- Barre de recherche -->
        <div class="search-container">
            <form id="searchForm" onsubmit="return searchEngine();">

                <div class="search-bar">
                    <input type="text" name="q" id="searchInput" placeholder="Rechercher..." autofocus>

                    <div class="vertical-separator"></div>

                    <select id="engine">
                        <option value="qwant" selected>Qwant</option>
                        <option value="google">Google</option>
                    </select>
                </div>

                <div class="buttons">
                    <button type="submit">Rechercher</button>

                    <button type="button" onclick="window.location.href='https://mbn.loritz.fr'">
                        Mon Bureau Numérique
                    </button>

                    <button type="button" onclick="window.location.href='pronote_web.html'">
                        Pronote WEB
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <div>Page créée par l'<a href="https://fablab.loritz.fr/">Incubateur Loritz'Labs</a></div>
        <div><a href="https://github.com/fablab-loritz/loritz-search-page">Code source</a></div>
        <div><a href="https://sh.loritz.fr/py5dB">Documentation Informatique</a></div>
        <div><a href="https://status.it.loritz.fr">Statut des infrastructures</a></div>
    </footer>




    <script>
    function searchEngine() {
        const query = document.getElementById("searchInput").value;
        const engine = document.getElementById("engine").value;

        let url;

        if (engine === "google") {
            url = "https://www.google.com/search?q=" + encodeURIComponent(query);
        } else {
            url = "https://www.qwant.com/?q=" + encodeURIComponent(query);
        }

        window.location.href = url;
        return false;
    }
    </script>
</body>
</html>
